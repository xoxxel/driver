site_name: پروژه نمونه
site_description: یک وب‌سایت ساده با MkDocs
site_author: تیم توسعه

theme:
  name: material
  language: fa
  direction: rtl
  logo: assets/icon-site.svg
  favicon: assets/logo.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: black
    accent: deep purple
  font:
    text: Vazirmatn
    code: Fira Code

nav:
  - خانه: index.md
  - درباره ما: about.md
  - تماس با ما: contact.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
    - icon: fontawesome/brands/telegram
      link: https://t.me/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/
